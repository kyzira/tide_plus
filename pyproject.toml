[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tide-plus"
version = "1.2"
description = "An extended version of TIDE with normalized confusion matrices and enhanced reporting"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Goerkem Batagen", email = "g@batagan.de" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Operating System :: OS Independent"
]
dependencies = [
    "appdirs",
    "numpy",
    "pycocotools",
    "opencv-python",
    "pillow",
    "seaborn",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "psutil"
]

[project.optional-dependencies]
# Live YOLO / RF-DETR adapters (running the models, not just reading their output files)
yolo = ["ultralytics"]
rfdetr = ["rfdetr", "supervision"]
# Interactive SAM click benchmark. Real inference also needs the sam3_labeling repo on
# the path (SAM3_LABELING_ROOT) plus its SAM weights; torch should match your CUDA.
interactive = ["torch", "transformers>=5.13"]
# Test suite
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/kyzira/tide-plus"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["tidecv*"]
